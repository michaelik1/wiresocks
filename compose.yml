services:
  wiresocks:
    image: wiresocks:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /path/to/wg0.conf:/config/wg_confs/wg0.conf:ro
