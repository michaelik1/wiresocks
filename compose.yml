networks:
  wg-warp-network:
    external: true

services:
  warp-wg:
    build: .
    image: warp-wg:latest
    container_name: warp-wg
    restart: unless-stopped
    networks:
      - wg-warp-network
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1